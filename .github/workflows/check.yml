name: Extension checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: extensions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run check:wiki
      - run: npm test
        timeout-minutes: 8
      - run: npm run check:web
      - run: npm run package:plugin -- whalewiki
      - run: npm run package:plugin -- whalesong
      - run: npm run package:plugin -- cloudflare-docs
      - run: npm run package:plugin -- codewhale-skills
      - run: npm run package:plugin -- chromewhale
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.os }}
          path: test-results/
